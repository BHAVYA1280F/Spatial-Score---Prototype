<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:#10131c;overflow:hidden;font-family:system-ui,sans-serif}
  #hud{position:absolute;top:10px;left:10px;display:flex;gap:8px;align-items:center;color:#cfd6e6;font-size:12px}
  button{background:#2f3e6b;color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
  button:hover{background:#41559a}
</style></head>
<body>
<div id="hud"><button id="mode">Walkthrough</button><span id="info"></span><span id="legend"></span><b id="zone"></b></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = __DATA__;
const W = DATA.width, segs = DATA.segments;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10131c);
scene.fog = new THREE.Fog(0x10131c, 80, 400);
const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(40, 80, 30);
scene.add(sun);
scene.add(new THREE.GridHelper(600, 120, 0x2a3350, 0x1b2133));

const BASE = {
  concrete: {color: 0x9a9a9a, rough: 0.9, op: 1},
  wood:     {color: 0xb07d45, rough: 0.7, op: 1},
  glass:    {color: 0x9fd8ee, rough: 0.1, op: 0.45},
};
function mat(name, opacity) {
  const b = BASE[name] || BASE.concrete;
  const o = Math.min(b.op, opacity);
  return new THREE.MeshStandardMaterial({
    color: b.color, roughness: b.rough, transparent: o < 1, opacity: o, side: THREE.DoubleSide});
}
function box(w, h, d, m, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z);
  return mesh;
}

const ZC = {intro: 0xffc98a, rhythm: 0x7fb2ff, harmony: 0xc89bff, climax: 0xff5a5a, outro: 0x9fd8c0, none: 0xffffff};
const pulse = [];
let climaxLights = 0;
const pts = [];
segs.forEach((s, idx) => {
  const g = new THREE.Group();
  g.position.set(s.x, 0, s.z);
  g.rotation.y = s.heading;
  const L = s.length, H = s.height, zone = s.zone || "none", tilt = s.tilt || 0;
  const light = s.light !== undefined ? s.light : 0.6;
  const wallOp = 1 - 0.8 * s.openness;
  g.add(box(W, 0.3, L, mat(s.material, 1), 0, 0.15, 0));
  const lean = (H / 2) * Math.sin(tilt);                       // climax walls lean outward
  const wl = box(0.25, H, L, mat(s.material, wallOp), -W / 2 - lean, H / 2, 0); wl.rotation.z = tilt;
  const wr = box(0.25, H, L, mat(s.material, wallOp), W / 2 + lean, H / 2, 0); wr.rotation.z = -tilt;
  g.add(wl); g.add(wr);
  if (zone !== "climax" && s.openness < 0.6) g.add(box(W, 0.25, L, mat(s.material, 1 - s.openness), 0, H, 0));
  const fin = mat("concrete", 1);
  for (let i = 0; i < s.ribs; i++) {
    const z = -L / 2 + (i + 0.5) * (L / s.ribs);
    [-1, 1].forEach(side => {
      if (zone === "climax") {                                  // tapered spires
        const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.3, H * 1.15, 6), fin);
        sp.position.set(side * (W / 2 + 0.25 + lean), H * 0.575, z);
        g.add(sp);
      } else g.add(box(0.2, H * 1.05, 0.2, fin, side * (W / 2 + 0.25), H * 0.525, z));
    });
  }
  for (let k = 1; k <= (s.layers || 0); k++) {                  // harmony: overlapping layers
    const off = (k % 2 ? 1 : -1) * (1.0 + 0.7 * k), hk = H * (0.5 + 0.35 * k), gm = mat("glass", 0.4);
    g.add(box(0.15, hk, L * 0.85, gm, off, hk / 2, 0));
    g.add(box(W * 0.7, 0.12, L * 0.7, gm, off * 0.4, hk, 0));
  }
  const base = new THREE.Color(ZC[zone]).multiplyScalar(0.25 + 0.75 * light);   // light strip
  const sm = new THREE.MeshBasicMaterial({color: base});
  g.add(box(W * 0.5, 0.12, L * 0.9, sm, 0, Math.max(1, H - 0.25), 0));
  if (zone === "climax") {
    pulse.push({m: sm, base: base, i: idx});
    if (climaxLights < 8 && idx % 2 === 0) {
      const pl = new THREE.PointLight(0xff6a3d, 1.2, 30);
      pl.position.set(0, H * 0.8, 0); g.add(pl);
      pulse.push({l: pl, i: idx}); climaxLights++;
    }
  }
  scene.add(g);
  pts.push(new THREE.Vector3(s.x0, 1.7, s.z0));
});
if (segs.length) {
  const l = segs[segs.length - 1];
  pts.push(new THREE.Vector3(l.x0 + Math.sin(l.heading) * l.length, 1.7, l.z0 + Math.cos(l.heading) * l.length));
}

// simple orbit controls (drag = rotate, wheel = zoom)
const xs = segs.map(s => s.x), zs = segs.map(s => s.z);
const mid = a => a.length ? (Math.min(...a) + Math.max(...a)) / 2 : 0;
const ext = a => a.length ? Math.max(...a) - Math.min(...a) : 0;
const target = new THREE.Vector3(mid(xs), 5, mid(zs));
let theta = 0.8, phi = 1.0, radius = Math.max(20, ext(xs), ext(zs)) * 0.9 + 25, walking = false, u = 0;
function orbit() {
  cam.position.set(
    target.x + radius * Math.sin(phi) * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.cos(theta));
  cam.lookAt(target);
}
let drag = false, lx = 0, ly = 0;
const cv = renderer.domElement;
cv.addEventListener("mousedown", e => { drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener("mouseup", () => drag = false);
addEventListener("mousemove", e => {
  if (!drag || walking) return;
  theta -= (e.clientX - lx) * 0.005;
  phi = Math.min(Math.PI / 2 - 0.02, Math.max(0.1, phi - (e.clientY - ly) * 0.005));
  lx = e.clientX; ly = e.clientY;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  if (!walking) radius = Math.max(5, radius * (1 + Math.sign(e.deltaY) * 0.1));
}, {passive: false});

// walkthrough along the path
const curve = pts.length > 1 ? new THREE.CatmullRomCurve3(pts) : null;
const btn = document.getElementById("mode");
btn.onclick = () => { walking = !walking; u = 0; zoneEl.textContent = ""; btn.textContent = walking ? "Back to orbit" : "Walkthrough"; };
document.getElementById("info").textContent =
  segs.length + " segments | tempo " + DATA.tempo + " BPM | drag to rotate, scroll to zoom";

const zoneEl = document.getElementById("zone");
document.getElementById("legend").innerHTML = [...new Set(segs.map(s => s.zone || "none"))]
  .filter(z => z !== "none").map(z => '<span style="color:#' + ZC[z].toString(16).padStart(6, "0") + '">&#9679; ' + z + '</span>').join(" ");
let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  if (walking && curve) {
    u = Math.min(1, u + (4 * dt) / curve.getLength());
    cam.position.copy(curve.getPointAt(u));
    cam.lookAt(curve.getPointAt(Math.min(1, u + 0.02)));
    zoneEl.textContent = "Zone: " + (segs[Math.min(segs.length - 1, Math.floor(u * segs.length))].zone || "");
    if (u >= 1) u = 0;
  } else orbit();
  const ts = now / 1000;
  pulse.forEach(p => {
    const k = 0.65 + 0.35 * Math.sin(ts * 3 + p.i * 0.6);
    if (p.m) p.m.color.copy(p.base).multiplyScalar(0.6 + 0.8 * k);
    if (p.l) p.l.intensity = 0.4 + 1.6 * k;
  });
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
addEventListener("resize", () => {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
requestAnimationFrame(loop);
</script></body></html>
